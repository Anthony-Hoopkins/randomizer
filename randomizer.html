<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Randomizer</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
<section class="display-section">
  <div id="generated_number" class="generated-number-display"></div>
</section>

<section class="manage-section">
  <button id="generate">Generate New</button>

  <details class="manage-data">
    <summary>Configurate Randomizer</summary>

    <p>
      <label>
        <span>Insert existing data. It, should be string with /, or array of numbers</span>
        <input type="text" id="already_generated" placeholder="Insert existing data"/>
      </label>
    </p>

    <p>
      <label>
        <span>Max value</span>
        <input id="max_number" type="number" placeholder="Insert Max Value"/>
      </label>
    </p>

    <p>
      <label>
        <span>Min value</span>
        <input id="min_number" type="number" min="1" placeholder="Insert Min Value"/>
      </label>
    </p>
  </details>
</section>

<section class="display-section">
  <div id="storage_display" class="display"></div>
</section>

<section class="display-section">
  <label>Question:</label>
  <div id="question_display" class="display"></div>
</section>

<section class="extra-button-section">
  <button class="refresh-button" id="clear-data">Clear Storage Data</button>
</section>

</body>

<script src="scripts.js"></script>
</html>
